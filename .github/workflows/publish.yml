name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-[a-z]+.[0-9]+"

jobs:
  publish:
    if: github.repository == 'rameel/ramstack.parsing'
    name: Publish packages
    runs-on: ubuntu-latest
    environment: publish

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Solution
        run: dotnet build -c Release -p:SkipInternalsVisibleTo=true

      - name: Create NuGet Packages
        run: dotnet pack -c Release -o ./nuget --no-build

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet Packages
        run: dotnet nuget push ./nuget/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate -s https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: nuget/*
